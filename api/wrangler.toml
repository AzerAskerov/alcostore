#:schema node_modules/wrangler/config-schema.json
name = "alcostore-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Müvəqqəti prod domeni (turmat.az zonası). alcostorebaku.az alınanda buraya əlavə olunacaq.
routes = [{ pattern = "alco.turmat.az", custom_domain = true }]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# ===========================================
# PRODUCTION (default) — https://alco.turmat.az (müvəqqəti) → api.alcostorebaku.az
# ===========================================

[[d1_databases]]
binding = "DB"
database_name = "alcostoreDb"
database_id = "669c5093-63f1-460d-aa0f-ec26694757a5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "alcostore-imgs"

[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://alco.turmat.az"
FRONTEND_URL = "https://alcoweb.turmat.az"
R2_PUBLIC_URL = "https://alco.turmat.az/media"
CORS_ORIGINS = "https://alcoweb.turmat.az,https://alcostorebaku.az,https://www.alcostorebaku.az"

# Secrets (wrangler secret put <NAME>):
#   JWT_SECRET            — admin JWT imzası
#   TELEGRAM_BOT_TOKEN    — @alcostore_bot (admin login + bildirişlər)
#   ADMIN_TELEGRAM_IDS    — vergüllə ayrılmış Telegram ID-lər (admin whitelist)
#   TELEGRAM_ORDERS_CHAT_ID (opsional) — sifariş bildirişləri üçün qrup; yoxdursa admin-lərə şəxsən gedir
#   EXPO_ACCESS_TOKEN     (opsional) — Expo push "enhanced security" aktivdirsə

# ===========================================
# LOCAL (wrangler dev --env local)
# ===========================================
[env.local]
name = "alcostore-api-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "alcostoreDb-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "alcostore-imgs-local"

[env.local.vars]
ENVIRONMENT = "local"
API_BASE_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:3000"
R2_PUBLIC_URL = "http://localhost:8787/media"
CORS_ORIGINS = "http://localhost:3000,http://localhost:8081,https://local.alcostorebaku.az"
JWT_SECRET = "local-dev-secret-DO-NOT-USE-IN-PRODUCTION"
# Yalnız local: Telegram-sız admin girişi (POST /admin/auth/dev). Dev/prod-da YOXDUR.
DEV_LOGIN_ENABLED = "1"
ADMIN_TELEGRAM_IDS = "0"

# ===========================================
# CLOUD DEV (wrangler deploy --env dev) — dev-api.alcostorebaku.az
# ===========================================
[env.dev]
name = "alcostore-api-dev"
# routes = [{ pattern = "dev-api.alcostorebaku.az", custom_domain = true }]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "alcostoreDb-dev"
database_id = "bbfaf3e2-e897-4143-a109-001e2ba3ab18"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "alcostore-imgs-dev"

[env.dev.vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://alcostore-api-dev.sigortamat90.workers.dev"
FRONTEND_URL = "https://alcostore-web-dev.sigortamat90.workers.dev"
R2_PUBLIC_URL = "https://alcostore-api-dev.sigortamat90.workers.dev/media"
CORS_ORIGINS = "https://alcostore-web-dev.sigortamat90.workers.dev,https://dev.alcostorebaku.az"
