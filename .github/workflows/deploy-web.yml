name: Deploy Web + API to Cloudflare

# TurMat/.github/workflows/deploy-web.yml əsasında. Dev mühiti YOXDUR — yalnız main → production.
# Sıra: API bundle dry-run → D1 migrations → API Worker deploy → web (OpenNext) build → web Worker deploy → smoke test.
# Web build API deploy-dan SONRA gedir ki, web xətası API düzəlişlərini saxlamasın (TurMat dərsi).
#
# Domenlər (2026-09-29): əsas alcostorebaku.az / api.alcostorebaku.az; köhnə alcoweb.turmat.az / alco.turmat.az
# AKTİV QALIR (store-lardakı linklər və review-dakı build-lər onlara baxır). Hər ikisi eyni Worker-lərdir.
# Repo dəyişənləri defoltları əvəz edir: PROD_API_URL (vebin API-si), PROD_BASE_URL (canonical), PROD_WEB_URL (köhnə smoke).
# API-nin öz URL/CORS dəyərləri api/wrangler.toml [vars]-dadır (tək mənbə) — burada override edilmir.

on:
  push:
    branches: [main]
    paths:
      - 'alcostore-web/**'
      - 'api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "api_url=${{ vars.PROD_API_URL || 'https://alco.turmat.az' }}" >> $GITHUB_OUTPUT
          echo "web_url=${{ vars.PROD_WEB_URL || 'https://alcoweb.turmat.az' }}" >> $GITHUB_OUTPUT
          echo "base_url=${{ vars.PROD_BASE_URL || 'https://alcostorebaku.az' }}" >> $GITHUB_OUTPUT
          echo "new_api_url=https://api.alcostorebaku.az" >> $GITHUB_OUTPUT
          echo "telegram_bot=${{ vars.TELEGRAM_BOT_USERNAME_PROD }}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Lockfile-dan deterministik install (TurMat 2026-07-23 dərsi)
      - name: Install
        run: npm ci --ignore-scripts

      # wrangler deploy API-nin YEGANƏ build addımıdır — sınıq import-u prod-dan əvvəl tutmaq üçün
      - name: Verify API bundle (dry-run)
        working-directory: api
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

      - name: Run D1 migrations
        working-directory: api
        run: npm run migrate:prod

      - name: Deploy API Worker
        working-directory: api
        run: npx wrangler deploy

      - name: Build web (OpenNext)
        working-directory: alcostore-web
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.api_url }}
          NEXT_PUBLIC_ENV: ${{ steps.env.outputs.environment }}
          # canonical/sitemap/robots yeni domenə baxır; köhnə domen eyni səhifələri göstərir
          NEXT_PUBLIC_BASE_URL: ${{ steps.env.outputs.base_url }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ steps.env.outputs.telegram_bot }}
          NEXT_PUBLIC_APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          NEXT_PUBLIC_PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
        run: npx opennextjs-cloudflare build

      - name: Deploy web Worker
        working-directory: alcostore-web
        run: npx opennextjs-cloudflare deploy

      # TurMat-dakı "boş səhifə deploy olunmasın" qapısının sadə forması — köhnə (store-lara verilmiş) domenlər SƏRT yoxlanılır
      - name: Smoke test (existing domains)
        run: |
          set -e
          api=$(curl -s -o /dev/null -w '%{http_code}' ${{ steps.env.outputs.api_url }}/health)
          echo "API /health → $api"; test "$api" = "200"
          curl -s ${{ steps.env.outputs.web_url }}/ -o home.html
          n=$(grep -o '/mehsul/[a-z0-9-]*' home.html | sort -u | wc -l)
          echo "Web / → $(wc -c < home.html) bytes, $n məhsul linki"
          test "$n" -ge 3
          for p in privacy terms support data-deletion; do
            c=$(curl -s -o /dev/null -w '%{http_code}' ${{ steps.env.outputs.web_url }}/$p)
            echo "/$p → $c"; test "$c" = "200"
          done

      # Yeni custom domenlərin SSL-i ilk deploy-da bir neçə dəqiqə buraxılır — gözləyirik, alınmasa xəbərdarlıq
      - name: Smoke test (alcostorebaku.az)
        run: |
          check() {
            for i in $(seq 1 30); do
              c=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              [ "$c" = "200" ] && { echo "✅ $1 → 200"; return 0; }
              sleep 10
            done
            echo "::warning::$1 hələ cavab vermir (son kod: $c) — SSL/DNS buraxılışını Cloudflare-də yoxlayın"
          }
          check ${{ steps.env.outputs.new_api_url }}/health
          check ${{ steps.env.outputs.base_url }}/
          check ${{ steps.env.outputs.base_url }}/privacy
          check https://www.alcostorebaku.az/

      - name: Summary
        run: |
          echo "### 🚀 ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ steps.env.outputs.base_url }} (+ köhnə ${{ steps.env.outputs.web_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ steps.env.outputs.new_api_url }} (+ köhnə ${{ steps.env.outputs.api_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
